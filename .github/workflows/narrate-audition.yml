# narrate-audition — record three Iron Fortress scenes in six free voices so the player
# can pick the narrator by ear (docs/spec-watch-voice-and-controls.md, Part C step 2).
#
# Runs on a GitHub runner because the voice models (Kokoro-82M, Piper) have to be
# downloaded and the sandbox can't. Like deck-verify.yml it only ever pushes back to the
# branch it ran on (dispatch it with that branch as the ref). The audition files are for
# listening, not for main — publish them for the player, then delete
# data/narration/audition/ before the branch's PR merges.
name: narrate-audition

on:
  # Dispatch only. The first audition ran on push from the branch that added this file
  # (run 38290628219, 2026-10-12); a push trigger left in place would re-record and
  # commit a new set of listening files every time this workflow is edited.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narrate-audition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System tools (espeak-ng for Kokoro's phonemizer fallback, ffmpeg for MP3)
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg

      - name: Voice runtimes (CPU-only torch keeps the download small)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "kokoro>=0.9" soundfile piper-tts
          python -m pip list 2>/dev/null | grep -i -E "^(kokoro|misaki|torch|piper|onnxruntime) "

      - name: Record the audition
        run: python .github/narrate/audition.py

      - name: Commit the audition back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narration/audition
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Narration audition: three Iron Fortress scenes in six free voices (runner)"
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
