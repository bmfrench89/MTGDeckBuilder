name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r webapp/requirements.txt
      - name: Run tests
        run: pytest
      # The COMMITTED decks' section integrity. pytest deliberately never reads
      # data/ (the suite is hermetic), so the real deck files are guarded here:
      # a typed card under a contradicting type section fails the build. Runs on
      # the committed snapshot + snapshot attrs, so it works on a fresh clone;
      # untyped cards (a fresh export before the enrichment loop) are reported
      # but never fail. 19 misfiled cards across 7 decks predate this step.
      - name: Check deck section integrity
        run: |
          python3 scripts/deck_sections.py --all --check \
            --collection data/collection/collection_snapshot.txt
      # The analysis scripts are stdlib-only; this catches an accidental new dependency.
      - name: Check scripts import with no extra packages
        run: |
          pip uninstall -y flask >/dev/null 2>&1 || true
          for f in scripts/*.py; do
            python -c "import sys; sys.path.insert(0,'scripts'); import importlib; importlib.import_module('$(basename ${f%.py})')"
          done
