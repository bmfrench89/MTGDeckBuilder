# deck-verify — run the two NETWORK-dependent grounding steps on a GitHub runner.
#
# Why this exists: a sandboxed Claude Code session has no route to Scryfall or
# EDHREC (the egress proxy answers 403 to CONNECT), so `carddb.py --verify`
# returns UNVERIFIED and `optimize.py` sees 0 field cards. Those are exactly the
# checks that keep this project honest, so they cannot just be skipped — and
# "run it on the player's PC" is the thing CLAUDE.md tells us not to do.
# GitHub's runners have unrestricted internet, so they run here instead.
#
# How this differs from field-snapshots.yml, and why it is a SEPARATE file:
# field-snapshots.yml ends in a hardcoded `git pull --rebase origin main` +
# `git push origin main`. Dispatching THAT on a feature branch would rebase the
# branch's own commits onto main and push them there — a silent merge with no
# review. This workflow only ever pushes back to the ref it ran on
# (`HEAD:${{ github.ref_name }}`), so it is safe to run from a working branch.
# field-snapshots.yml stays the scheduled main-branch job; this is the on-demand
# one a session drives while a deck is still in review.
#
# It runs on PUSH to a working branch on purpose: `workflow_dispatch` is only
# dispatchable once the file is on the DEFAULT branch, which is no help to the
# session that is writing the workflow in the first place. Pushing the branch
# triggers it, and the dispatch inputs stay for later manual runs.
name: deck-verify

on:
  push:
    branches: ["claude/**"]
    paths:
      - "data/decks/*.txt"
      - "data/reference/verify-queue.txt"
      - ".github/workflows/deck-verify.yml"
      # The DFC probe below is UAT for the enrichment path itself, and the only
      # place it can run for real — Scryfall is unreachable from a sandbox. So a
      # change to the Scryfall client has to re-run it, or the probe only ever
      # validates the commit that happened to also touch a deck.
      - "scripts/carddb.py"
      - "scripts/mtglib.py"
  workflow_dispatch:
    inputs:
      commander:
        description: "Commander to snapshot (exact deck-header name). Blank = every commander in data/decks."
        required: false
        default: ""
      cards:
        description: "Cards to verify, separated by ' | '. Blank = read data/reference/verify-queue.txt."
        required: false
        default: ""
      commit:
        description: "Commit the field snapshot back to this branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deck-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Stdlib-only by design (CLAUDE.md: scripts/ takes no third-party deps),
      # so there is deliberately no pip install step here.

      # Verbatim oracle text for every card the sandbox could not confirm. The
      # LOG is the deliverable — a session reads it back with get_job_logs — and
      # the JSON goes to an artifact so nothing depends on log formatting.
      - name: Verify card oracle text
        id: verify
        run: |
          set -euo pipefail
          if [ -n "${CARDS_INPUT}" ]; then
            printf '%s\n' "${CARDS_INPUT}" | tr '|' '\n' > /tmp/raw.txt
            echo "source: workflow_dispatch input"
          elif [ -f data/reference/verify-queue.txt ]; then
            cp data/reference/verify-queue.txt /tmp/raw.txt
            echo "source: data/reference/verify-queue.txt"
          else
            : > /tmp/raw.txt
          fi
          # An EMPTY queue is the STEADY STATE, not an error — a session clears it
          # once every answer is written up. Strip comments and blanks with sed,
          # which exits 0 when it deletes everything; `grep -v` exits 1 on no
          # match and, under `pipefail`, failed the whole job the first time the
          # queue was emptied. Do not reintroduce grep here.
          sed -e 's/^[[:space:]]*//; s/[[:space:]]*$//' -e '/^#/d' -e '/^$/d' \
            /tmp/raw.txt > /tmp/names.txt
          count=$(wc -l < /tmp/names.txt)
          echo "Verifying ${count} card(s) against Scryfall"
          if [ "${count}" -eq 0 ]; then exit 0; fi
          ARGS=()
          while IFS= read -r n; do ARGS+=(--verify "$n"); done < /tmp/names.txt
          echo "===== VERBATIM ORACLE TEXT ====="
          set +e
          python3 scripts/carddb.py "${ARGS[@]}"
          python3 scripts/carddb.py "${ARGS[@]}" --json > verify-results.json
          set -e
          echo "===== END VERBATIM ORACLE TEXT ====="
        env:
          CARDS_INPUT: ${{ inputs.cards }}

      # UAT for the enrichment path itself — the one thing unit tests cannot prove,
      # because the bug it guards is a LIVE Scryfall behaviour (docs/spec-dfc-enrichment.md).
      #
      # Why it lives here and not in attrs-snapshot.yml: that workflow ends in a
      # hardcoded `git push origin main`, so dispatching it from a working branch
      # would push an unreviewed regenerated snapshot straight to main. This job only
      # ever pushes to its own ref, so the probe belongs here. It writes to /tmp and
      # commits NOTHING — the log is the deliverable.
      #
      # The input is derived from the committed snapshot rather than a checked-in
      # fixture, so it can never drift out of date: every " // " name the player
      # actually owns, enriched for real, and the coverage printed per card.
      - name: Probe — do double-faced cards enrich?
        run: |
          set -euo pipefail
          grep ' // ' data/collection/collection_snapshot.txt > /tmp/dfc.txt || true
          n=$(wc -l < /tmp/dfc.txt)
          echo "===== DFC ENRICHMENT PROBE ====="
          echo "double-faced names in the committed snapshot: ${n}"
          if [ "${n}" -eq 0 ]; then echo "nothing to probe"; exit 0; fi
          # --min-match 95 on purpose: this input is 100% double-faced, so it
          # exercises the per-category gate (slice 3) as well as the enrichment.
          # rc is captured rather than `|| true`d away — a non-zero here IS the
          # finding, and the python check below still runs either way.
          set +e
          python3 scripts/carddb.py --collection /tmp/dfc.txt \
            --out /tmp/dfc-attrs.csv --no-ids --min-match 95
          rc=$?
          set -e
          echo "carddb exit code: ${rc}  (0 = clean, 3 = below a floor, 2 = network)"
          python3 - <<'EOF'
          import csv, sys
          sys.path.insert(0, "scripts")
          import mtglib
          want = [c.name for c in mtglib.load_collection("/tmp/dfc.txt")]
          try:
              got = {r["Name"] for r in csv.DictReader(open("/tmp/dfc-attrs.csv",
                                                            encoding="utf-8"))}
          except FileNotFoundError:
              got = set()
          missing = [n for n in want if n not in got]
          print(f"resolved {len(want) - len(missing)}/{len(want)} double-faced cards")
          for n in missing:
              print(f"  STILL MISSING: {n}")
          # Type is what the land heuristic overrides; a DFC enriched with an empty
          # Type is the Scavenger Regent incident all over again, so check it too.
          rows = {r["Name"]: r for r in csv.DictReader(
              open("/tmp/dfc-attrs.csv", encoding="utf-8"))} if got else {}
          untyped = [n for n, r in rows.items() if not (r.get("Type") or "").strip()]
          for n in untyped:
              print(f"  RESOLVED BUT UNTYPED: {n}")
          print("PROBE VERDICT:",
                "PASS" if not missing and not untyped else "FAIL")
          EOF
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::carddb exited ${rc} on the DFC probe — read the log above"
          fi
          echo "===== END DFC ENRICHMENT PROBE ====="

      # EDHREC inclusion/synergy. Without it optimize.py has no field to tune
      # against and the top-25 overlap check cannot run at all.
      - name: Snapshot the commander's field
        run: |
          set +e
          if [ -n "${COMMANDER}" ]; then
            python3 scripts/edhrec.py "${COMMANDER}" --snapshot \
              --collection data/collection/collection_snapshot.txt
          else
            python3 scripts/edhrec.py --snapshot-all \
              --collection data/collection/collection_snapshot.txt
          fi
          if [ $? -ne 0 ]; then
            echo "::warning::EDHREC snapshot reported a failure — see the log above"
          fi
          echo "===== FIELD SNAPSHOTS ON DISK ====="
          ls -la data/reference/field/ || true
          exit 0
        env:
          COMMANDER: ${{ inputs.commander }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deck-verify-results
          path: |
            verify-results.json
            data/reference/field/
          if-no-files-found: warn

      # Push ONLY to the branch this ran on. Never to main — see the header
      # comment; that distinction is the whole reason this file is separate.
      - name: Commit the snapshot back to this branch
        if: github.event_name == 'push' || inputs.commit
        run: |
          git config user.name  "deck-verify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference/field/
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git commit -m "Field snapshots: deck-verify run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) — rebasing and retrying"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((3 * attempt))
          done
          echo "::error::could not push the snapshot after 3 attempts"
          exit 1
